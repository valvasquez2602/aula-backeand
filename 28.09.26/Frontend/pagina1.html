<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Catálogo</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
    <link rel="stylesheet" href="https://jsdelivr.net">
    <link rel="stylesheet" href="pagina1.css">
</head>
<body>

    <nav class="navbar fixed-top shadow-sm">
        <div class="container-fluid px-4">
            <div class="d-flex align-items-center">
                <button class="btn custom-logo-btn me-3" id="logoBtn">CineFlix</button>
                <div class="search-bar-placeholder d-none d-md-block">
                    <i class="bi bi-search text-white-50 ms-3 me-2"></i>
                    <span class="text-white-50 small">Pesquisar filmes...</span>
                </div>
            </div>
            <div class="ms-auto d-flex align-items-center">
                <div class="profile-icon d-flex align-items-center justify-content-center text-white shadow-sm">
                    <i class="bi bi-person-fill"></i>
                </div>
            </div>
        </div>
    </nav>

    <div class="sidebar shadow" id="sidebarMenu">
        <div class="p-4">
            <h5 class="text-white fw-bold mb-4 opacity-75">Navegação</h5>
            <ul class="nav flex-column gap-2">
                <li class="nav-item"><a class="nav-link text-light active-link" href="#"><i class="bi bi-house-door me-2"></i> Início</a></li>
                <li class="nav-item"><a class="nav-link text-white-50" href="#"><i class="bi bi-film me-2"></i> Filmes</a></li>
                <li class="nav-item"><a class="nav-link text-white-50" href="#"><i class="bi bi-star me-2"></i> Favoritos</a></li>
                <hr class="border-secondary my-4">
                <li class="nav-item"><a class="nav-link text-danger" href="index.html" id="logoutBtn"><i class="bi bi-box-arrow-right me-2"></i> Sair</a></li>
            </ul>
        </div>
    </div>

    <main class="main-content">
        <div class="container px-4">
            <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-3 g-4" id="movieGrid">
                
                <div class="col text-center py-5 w-100">
                    <div class="spinner-border text-white" role="status">
                        <span class="visually-hidden">Carregando...</span>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <script src="pagina1.js"></script>
</body>
</html>
