<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Filmes</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>

<body class="d-flex align-items-center justify-content-center">

    <div class="login-container p-3">
        <div class="card border-0 custom-card text-center p-4 p-sm-5">
            <div class="card-body p-0">

                <div class="mb-4">
                    <span class="cinema-emoji">🎬</span>
                </div>

                <h3 class="fw-bold custom-title mb-2">Bem-vindo(a) de volta!</h3>
                <p class="custom-subtitle mb-4">Entre para explorar, favoritar e assistir aos melhores filmes 🍿</p>

                <form id="loginForm" class="needs-validation text-start" novalidate>

                    <div class="mb-3">
                        <label for="email" class="form-label custom-label">E-mail</label>
                        <input type="email" class="form-control custom-input" id="email" placeholder="Digite seu e-mail"
                            required>
                        <div class="invalid-feedback">Por favor, insira um e-mail válido.</div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label custom-label">Senha</label>
                        <input type="password" class="form-control custom-input" id="password"
                            placeholder="Digite sua senha" required minlength="6">
                        <div class="invalid-feedback">A senha precisa ter pelo menos 6 caracteres.</div>
                    </div>

                    <button type="submit" class="btn custom-btn w-100 py-2.5 fw-semibold mb-4"><a href="pagina1.html">Entrar</a></button>

                    <div class="text-center">
                        <p class="custom-footer-text mb-0">Não tem conta? <a href="./pagina1.html"
                                class="custom-link">Cadastre-se</a></p>
                    </div>

                </form>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
