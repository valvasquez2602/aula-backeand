<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Catálogo - Filmes</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
    <link href="https://jsdelivr.net" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar navbar-dark bg-dark-stream sticky-top py-3">
        <div class="container">
            <a class="navbar-brand fw-bold text-orange fs-3" href="#">YouCine TV</a>
            <div class="d-flex gap-2">
                <button class="btn btn-orange text-white fw-medium" type="button" data-bs-toggle="collapse" data-bs-target="#formCadastro">
                    <i class="bi bi-plus-lg me-1"></i> Cadastrar Filme
                </button>
            </div>
        </div>
    </nav>

    <div class="container my-4 text-white">
        <div class="row mb-4">
            <div class="col-md-6 mx-auto">
                <div class="input-group search-box">
                    <span class="input-group-text bg-transparent border-0 text-secondary"><i class="bi bi-search"></i></span>
                    <input type="text" id="inputBusca" class="form-control bg-transparent border-0 text-white" placeholder="Search movies, TV shows...">
                </div>
            </div>
        </div>

        <div class="collapse mb-5" id="formCadastro">
            <div class="card card-stream-form p-4">
                <h4 class="mb-4 text-orange"><i class="bi bi-film me-2"></i>Novo Filme</h4>
                <form id="meuFormulario">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label text-secondary small">Título</label>
                            <input type="text" id="titulo" class="form-control stream-input" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label text-secondary small">Gênero</label>
                            <input type="text" id="genero" class="form-control stream-input" placeholder="Ex: Ação, Drama" required>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label text-secondary small">Nota (1 a 5)</label>
                            <input type="number" id="nota" class="form-control stream-input" min="1" max="5" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label text-secondary small">URL do Pôster (Link da imagem)</label>
                            <input type="url" id="url_imagem" class="form-control stream-input" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label text-secondary small">Sinopse</label>
                            <textarea id="sinopse" class="form-control stream-input" rows="3" required></textarea>
                        </div>
                        <div class="col-12 text-end mt-4">
                            <button type="button" class="btn btn-secondary me-2" data-bs-toggle="collapse" data-bs-target="#formCadastro">Cancelar</button>
                            <button type="submit" class="btn btn-orange text-white px-4">Salvar Filme</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <section>
            <h2 class="section-title mb-4">Filmes Cadastrados</h2>
            <div class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-5 g-3" id="movieGrid">
            </div>
        </section>
    </div>

    <script src="https://jsdelivr.net"></script>
    <script src="js.js"></script>
</body>
</html>
